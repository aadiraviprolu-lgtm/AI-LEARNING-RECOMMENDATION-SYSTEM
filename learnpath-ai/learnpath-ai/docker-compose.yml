# One-command local stack: PostgreSQL + API.  Run:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnpath
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/learnpath
      JWT_SECRET: docker-dev-secret-change-me-please-0123456789
      CORS_ORIGINS: http://localhost:5173
    ports: ["4000:4000"]
volumes:
  pgdata:
